[project]
name = "whychain"
version = "0.1.0"
description = "Multi-agent supply chain investigator that explains why orders are at risk, with evidence from fragmented data sources."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.40",
    "httpx>=0.27",
    "duckdb>=1.1",
    "sqlglot>=25",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "fastapi>=0.115",
    # the stock-transfer linear program (whychain/lp.py)
    "ortools>=9.10",
    "highspy>=1.7",
    "numpy>=1.26",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
whychain = "whychain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whychain", "datagen"]

