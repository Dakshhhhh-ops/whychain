[project]
name = "whychain"
version = "0.1.0"
description = "Multi-agent supply chain investigator that explains why orders are at risk, with evidence from fragmented data sources."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.40",
    "httpx>=0.27",
    "duckdb>=1.1",
    "sqlglot>=25",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "fastapi>=0.115",
    # Declared pre-existing component: the author's Optiagent verified-optimization engine (MIT), pinned
    "optiagent-core @ git+https://github.com/Dakshhhhh-ops/Optiagent@f0b61d580ef25ad8da306067b309cae564c02910#subdirectory=core",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
whychain = "whychain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whychain", "datagen"]
