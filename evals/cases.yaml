# Ground truth. The agents never see this file.
# must_find: groups of synonyms; a group matches if any synonym appears, as a whole word or word stem, in a CONFIRMED
#   finding (a cause, a measurement, or a document finding whose quotes were verified; hypothesis + claim) or the
#   headline. min_groups defaults to all.
# distractors: groups that must NOT appear in the hypothesis statement of any confirmed cause.
# headline_must_not: regexes that must not match the headline (e.g. blaming a red herring).
# held_out: true for real-data questions added after the prompts were last changed; prompts are not tuned on them.

- id: A-pune-at-risk
  question: Why are so many Pune orders at risk of missing their promised date next week?
  must_find:
    - [strike, port]
    - [voltix, s-14]
  distractors:
    - [rain, weather]
  expected_actions:
    - [transfer, mumbai, mum]

- id: B-nashik-late
  question: Why have deliveries to Nashik been late since September?
  must_find:
    - [consolidat, milk run, milk-run, tuesday, twice a week, tue/fri]
    - [swiftcargo, c02]
  distractors:
    - [stockout, out of stock, backorder]
  expected_actions:
    - [deccan, c03, switch carrier, alternative carrier, ftl]

- id: C-mumbai-earbuds
  question: Why did Mumbai run out of earbuds in mid-October?
  must_find:
    - [diwali26, promo, promotion, campaign]
    - [soundwave, s-07]
  distractors:
    - [strike, port]
  expected_actions:
    - [air, expedite, reorder point]

- id: D-chennai-backlog
  question: Why has the Chennai DC's open-order backlog jumped this week?
  must_find:
    - [duplicate, external_ref, edi]
  distractors:
    - [weather, thunderstorm]
  expected_actions:
    - [dedup, duplicate, cancel]

- id: E-ontime-drop
  question: Why did our overall on-time delivery rate drop in September and October compared with August?
  min_groups: 2
  must_find:
    - [nashik, consolidat, swiftcargo]
    - [strike, port, voltix]
    - [diwali26, promo, earbud, soundwave]
  distractors:
    - [weather, rain]
  expected_actions:
    - [carrier, transfer, expedite]

# --- Kaveri held-out questions, added 22 Oct ~19:10 IST, after the supply engine and the stock-wait test were
# written. Ground truth was computed with SQL (scratch queries recorded in the commit message) before any engine or
# agent ran these questions, and the system is not changed between adding them and their first scored run.
# The causes are still ones the author planted in the simulator, so they test new scopes and wordings of known
# mechanisms, plus one question with a false premise.

- id: KH1-chennai-powerbanks
  held_out: true
  question: Why are power banks out of stock at the Chennai DC?
  # SQL: CHN's open backorders are mostly S-14 (Voltix): Power Banks 2,140 units, Chargers 2,135. Eight power-bank POs
  # expected 12 Oct now show an ETA of 31 Oct, port of entry Chennai, where a dock strike began 9 Oct.
  must_find:
    - [voltix, s-14]
    - [strike, port]
  distractors:
    - [diwali26, promo, promotion]
  expected_actions:
    - [transfer, chase, expedite, air]

- id: KH2-hyderabad-september
  held_out: false  # held out until commit 4ae49f7 changed code because of it; first run 20261022-191234-0dc3: FAIL (red herring: transit)
  held_out_run: 20261022-191234-0dc3   # its first, held-out run
  question: Why did deliveries to Hyderabad get later in September?
  # SQL: late 17.3% in September vs 3.3% in August. Hand-over rose 2.41 -> 3.21 days, transit flat (2.03 -> 2.06),
  # same carrier (C02) and warehouse (CHN). Orders handed over after their requested ship date: 15.3% vs 2.2%, with
  # a short line at the warehouse on that date (earbuds S-07 and S-19, keyboards S-02, ...). Not the carrier: C02's
  # problem is the Nashik consolidation, and Hyderabad transit didn't change.
  must_find:
    - [hand-over, handover, dispatch]
    - [stock, stock-out, stockout, waited]
  distractors:
    - [transit got slower, carrier transit, consolidat]
  expected_actions:
    - [stock-out, stockout, stock]

- id: KH3-pune-october-false-premise
  held_out: false  # held out until commit 4ae49f7 changed code because of it; first run 20261022-191325-32b1: pass
  held_out_run: 20261022-191325-32b1   # its first, held-out run
  question: Why did late deliveries to Pune rise in October?
  # SQL: Pune late rate by order month: Aug 11.0%, Sep 13.9%, Oct 4.4%. Lateness fell; there is no rise to explain.
  must_find:
    - [no cause, no rise, did not rise, nothing to explain, fell, lower than]
  distractors:
    - [slower, later, shorter, surge, waited for stock, duplicate, late inbound, strike]

# --- Replacement held-out questions, added 22 Oct 19:28 IST after KH2 and KH3 became development cases (commit
# 4ae49f7). Ground truth from SQL (scratch queries summarised below) before any engine or agent ran them; the code is
# not changed between adding them and their first scored run.

- id: KH4-surat-september
  held_out: true
  question: Why were deliveries to Surat late so often in September?
  # SQL: Surat late 21.8% in September vs 6.7% in August (87 vs 89 delivered orders, all from MUM, carrier C03 both
  # months). Hand-over 2.73 -> 4.07 days; transit flat (2.07 -> 2.11); promised days LONGER (4.92 -> 5.46). Orders
  # handed over after their requested ship date 17.2% vs 3.4%; on that date the warehouse was short of one of their
  # SKUs, mostly Voltix S-14 (power banks 5 orders, chargers 2), then keyboards S-02/S-16 and routers S-09.
  min_groups: 2
  must_find:
    - [hand-over, handover, dispatch]
    - [stock, stock-out, stockout, waited]
    - [voltix, s-14]
  distractors:
    - [transit got slower, carrier transit, consolidat]
    - [promised delivery windows got shorter, shorter promise]
  expected_actions:
    - [stock-out, stockout, stock]

- id: KH5-mumbai-chargers-false-premise
  held_out: true
  question: Why is there a charger shortage at the Mumbai DC?
  # SQL: MUM has NO open charger backorders (0 units). Its open backorders are earbuds (S-07, 3,302 units), cables,
  # routers, smart plugs, speakers, keyboards. No open charger POs for MUM. The premise is false.
  must_find:
    - [no cause, 0 of, no shortage, not short, nothing to explain]
  distractors:
    - [late inbound, spiked, too low, duplicate, strike, port]

# --- Olist (REAL data). Nothing is planted: the ground truth below was established independently with SQL on the
# raw data (weekly and per-state breakdowns) before scoring the agents. No expected actions: there is no single
# right business action on historical data.

- id: O1-march-2018
  dataset: olist
  question: Why did late deliveries jump to 19% for orders placed in March 2018?
  # carrier transit ~15 days for parcels handed over 26 Feb-18 Mar (normal ~8.5); seller hand-over got faster;
  # concentrated in Rio de Janeiro (transit 9.7 -> 20.7 days, late 7% -> 36%) and the Northeast
  min_groups: 2
  must_find:
    - [transit, carrier]
    - [rio, rj, northeast, nordeste, ceará, maranhão]
  # the strike was 12-13 Mar but lateness was already high before it. "correios" alone is not a distractor: Correios
  # is the carrier, so a correct transit cause names it.
  distractors:
    - [strike, greve]
  headline_must_not:
    - "(due to|because of|caused by|triggered by|driven by|after|following)\\s+((the|a|an)\\s+)?(correios\\s+)?(national\\s+)?(postal\\s+)?(workers'?\\s+)?strike"

- id: O2-black-friday-2017
  dataset: olist
  question: Why did deliveries run late around Black Friday 2017?
  # week of 20 Nov 2017: 2,915 orders (2.3x normal), 19.4% late; transit 12.4 days vs ~9; hand-over to carrier ~flat
  min_groups: 2
  must_find:
    - [volume, surge, black friday, peak, more orders, order spike]
    - [transit, carrier]
  distractors:
    - [data quality, data-quality, duplicate, artefact, artifact]

- id: O3-truckers-strike-2018
  dataset: olist
  question: Did the May 2018 truckers' strike delay deliveries, and by how much?
  # parcels handed to the carrier in the strike week (21-27 May) took 10.5 days vs ~8 and were 15.5% late vs ~4%;
  # orders placed 14-20 May (already in the pipeline) were 16% late. Orders placed during the strike fell by about
  # half and got much longer promises (about 20 -> 37 days), so late-vs-promise for them looks normal: the effect
  # is hidden unless orders are grouped by when they were exposed (weekly, by carrier hand-over date).
  min_groups: 2
  must_find:
    - [strike, trucker, caminhoneiro]
    - [transit, in-transit, in flight, carrier, week before, 14 may, mid-may]
  distractors:
    - [volume surge, demand surge, order surge]
  headline_must_not:
    - "^\\s*no\\b"
    - "\\b(did not|didn't|had no|no)\\s+(measurabl\\w*\\s+|significant\\s+|material\\s+)?(delay|effect|impact)\\b"

# --- Held-out real-data questions (added 22 Oct after the last prompt change; prompts are not tuned on them).
# Ground truth computed with SQL on the raw data BEFORE any agent ran these questions.

- id: H1-carnival-2018
  dataset: olist
  held_out: true
  question: Did Carnival 2018 (12-14 February) delay deliveries?
  # Carnival week: carrier hand-overs dipped ~20% (1,338 vs ~1,700/week) but transit did not jump (12.3 days vs 12.6
  # the week before). Transit had been rising since late January (10.1 -> 12.6) and kept rising to 15.6 in early
  # March. Carnival is not the explanation for February's lateness; the carrier slowdown is a longer trend.
  min_groups: 1
  must_find:
    - [transit, carrier]
  distractors:
    - [carnival, carnaval, holiday]
  headline_must_not:
    - "(due to|because of|caused by|triggered by|driven by|after|following)\\s+((the|a|an)\\s+)?(carnival|carnaval|holiday)"
    - "^yes\\b"

- id: H2-northeast-delays
  dataset: olist
  held_out: true
  question: Why are deliveries to Northeast states like Maranhão and Ceará late so often?
  # Northeast: 12.7% late vs 6.2% elsewhere; carrier transit 16.6 vs 8.6 days; promises 30.7 vs 23.0 days (the extra
  # promise covers about the extra transit, with no margin for its variability); 71% of items ship from SP sellers and
  # 99% of Northeast orders cross state lines. Seller hand-over is the same (3.4 vs 3.2 days): a red herring.
  min_groups: 2
  must_find:
    - [transit, distance, long-haul, far, interstate]
    - [são paulo, sao paulo, sp, southeast, sudeste, out-of-state, other state, other states, seller location, sellers located]
  distractors:
    - [hand-over, handover, hand over, shipping_limit, shipping limit, seller delay, sellers delay, seller-side]

- id: H3-rio-security
  dataset: olist
  held_out: true
  question: Did cargo theft in Rio de Janeiro slow deliveries there?
  # RJ: 12.1% late vs 4.6% (MG) and 4.0% (PR), states a similar distance from the SP sellers; transit 12.0 vs 8.8 days;
  # worse in nearly every month. Consistent with the documented security problems (record cargo theft 2017,
  # restricted-delivery areas, a Correios surcharge citing violence), but the order data cannot prove theft is the
  # cause. A good answer compares RJ with similar-distance states and says what the data can't show.
  min_groups: 2
  must_find:
    - [transit, slower, longer, late]
    - [mg, minas, pr, paraná, parana, similar distance, comparable, neighbour, neighbor, other southeast, espírito, espirito]
