services:
  erp-postgres:
    image: postgres:16-alpine
    container_name: whychain-erp
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_USER: ${POSTGRES_USER:-whychain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whychain-local}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - erp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whychain} -d ${POSTGRES_DB:-erp}"]
      interval: 3s
      retries: 20

volumes:
  erp-data:
